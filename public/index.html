<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" href="<%= BASE_URL %>favicon.ico">
    <!-- <title>项目</title> -->
    <style>
        .eejxk-home {
            position: absolute;
            z-index: 10000;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            user-select: none;
            color: #495057;
            background-color: snow;
        }
        .eejxk-home .loading {
            position: relative;
            display: inline-block;
            width: 1em;
            height: 1em;
            color: inherit;
            vertical-align: middle;
            pointer-events: none;
            transform: scale(3);
        }
        .eejxk-home .loading::before,
        .eejxk-home .loading::after {
            content: '';
            display: block;
            position: absolute;
            background-color: currentColor;
            left: 50%;
            right: 0;
            top: 0;
            bottom: 50%;
            box-shadow: -0.5em 0 0 currentColor;
            animation: loading 1s linear infinite;
        }
        .eejxk-home .loading::after {
            top: 50%;
            bottom: 0;
            animation-delay: 0.25s;
        }
        @keyframes loading {
            0%,
            100% {
                box-shadow: -0.5em 0 0 transparent;
                background-color: currentColor;
            }
            50% {
                box-shadow: -0.5em 0 0 currentColor;
                background-color: transparent;
            }
        }
        .eejxk-home .text {
            font-size: 24px;
            margin-top: 50px;
        }
    </style>
  </head>
  <body>
    <noscript>
      <strong>我们很抱歉，但项目不能正常工作，没有启用JavaScript。请启用它继续。</strong>
    </noscript>
    <div id="app-tgmc3iola6hf8e60">
        <div class="eejxk-home">
            <div class="loading"></div>
            <div class="text">loading...</div>
        </div>
    </div>
    <script src="<%= BASE_URL %>statics/monaco-editor/min/vs/loader.js"></script>

    <script>

        require.config({
            paths: {
                'vs': window.location.origin+'/statics/monaco-editor/min/vs',
            },
            'vs/nls':{
                'availableLanguages': { '*': 'zh-cn' }
            }
        });
        // 将monaco变量赋值为全局变量
        require(['vs/editor/editor.main'], function() {});
      </script>
    <!-- <script src="<%= BASE_URL %>statics/monaco-editor/min/vs/editor/editor.main.js"></script> -->
    <!-- built files will be auto injected -->
  </body>
</html>
